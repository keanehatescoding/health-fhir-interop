<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portable Medical History Demo</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --border: #dde3ea; --text: #1c2530;
    --muted: #6b7684; --accent: #2563eb; --before: #b45309; --after: #15803d;
    --review: #b91c1c; --review-bg: #fef2f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 28px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  select { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); min-width: 260px; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 28px 60px; }
  .review-banner { display: none; background: var(--review-bg); border: 1px solid var(--review); color: var(--review); padding: 4px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
  .review-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid #fbd5d5; }
  .review-row:last-child { border-bottom: none; }
  .review-row.reviewed { color: var(--after); }
  .review-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .review-actions button { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid; cursor: pointer; font-weight: 600; }
  .btn-approve { background: #ecfdf5; border-color: var(--after); color: var(--after); }
  .btn-approve:hover { background: var(--after); color: #fff; }
  .btn-reject { background: #fff; border-color: var(--review); color: var(--review); }
  .btn-reject:hover { background: var(--review); color: #fff; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .columns { grid-template-columns: 1fr; } }
  .col-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin-bottom: 12px; }
  .col-title.before { color: var(--before); }
  .col-title.after { color: var(--after); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .id-badge { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-family: ui-monospace, monospace; margin: 2px 4px 2px 0; }
  .id-badge.mismatch { background: #fff7ed; color: var(--before); }
  .id-badge.consent-permit { background: #ecfdf5; color: var(--after); font-family: inherit; }
  .id-badge.consent-deny { background: var(--review-bg); color: var(--review); font-family: inherit; font-weight: 600; }
  .withheld-notice { background: var(--review-bg); color: var(--review); border: 1px solid var(--review); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
  .field-row { font-size: 13px; color: var(--muted); margin: 2px 0; }
  .field-row b { color: var(--text); font-weight: 600; }
  .event { border-left: 2px solid var(--border); padding: 6px 0 6px 12px; margin: 8px 0; font-size: 13px; }
  .event .date { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .event .label { font-weight: 600; }
  .event .detail { color: var(--muted); }
  .unified-card { border: 2px solid var(--after); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Portable Medical History &mdash; NHIF &amp; Private Facility Unification</h1>
    <p>Prototype: AWS HealthLake as the interoperability layer. Synthetic data only.</p>
  </div>
  <select id="patient-picker"></select>
</header>
<main>
  <div class="review-banner" id="review-banner"></div>
  <div class="columns">
    <div>
      <div class="col-title before">Before &mdash; siloed records, mismatched IDs</div>
      <div id="before-panel"></div>
    </div>
    <div>
      <div class="col-title after">After &mdash; one unified patient timeline</div>
      <div id="after-panel"></div>
    </div>
  </div>
</main>
<script>
const picker = document.getElementById('patient-picker');
const beforePanel = document.getElementById('before-panel');
const afterPanel = document.getElementById('after-panel');
const reviewBanner = document.getElementById('review-banner');

async function loadPatients(preferredId) {
  const res = await fetch('/api/patients');
  const people = await res.json();
  picker.innerHTML = people.map(p =>
    `<option value="${p.person_id}">${p.display_name} (${p.sources.length} source${p.sources.length>1?'s':''}${p.flagged_for_review?' - flagged':''})</option>`
  ).join('');
  // ?patient=<id> deep-links directly to one patient's before/after view;
  // preferredId (passed after a review decision) takes priority over that.
  const requested = preferredId || new URLSearchParams(location.search).get('patient');
  const initial = (requested && people.some(p => p.person_id === requested))
    ? requested : (people[0] && people[0].person_id);
  if (initial) { picker.value = initial; loadPatient(initial); }
}

picker.addEventListener('change', () => loadPatient(picker.value));

async function loadPatient(personId) {
  const [beforeRes, afterRes] = await Promise.all([
    fetch(`/api/patients/${personId}/before`).then(r => r.json()),
    fetch(`/api/patients/${personId}/after`).then(r => r.json()),
  ]);
  renderBefore(beforeRes);
  renderAfter(afterRes);
}

async function decideReview(personIdA, personIdB, decision) {
  const res = await fetch('/api/review-decisions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ person_id_a: personIdA, person_id_b: personIdB, decision }),
  });
  const result = await res.json();
  await loadPatients(result.person_id);
}

function renderBefore(data) {
  const pending = data.possible_links || [];
  const reviewed = data.reviewed_links || [];

  if (pending.length || reviewed.length) {
    reviewBanner.style.display = 'block';
    reviewBanner.innerHTML =
      pending.map(l => `
        <div class="review-row">
          <span>&#9888; Possible match with another record (similarity score ${l.score}) &mdash; NOT auto-merged, flagged for human review (FHIR <code>Patient.link</code> type=<code>seealso</code>).</span>
          <span class="review-actions">
            <button class="btn-approve" onclick="decideReview('${l.person_id_a}','${l.person_id_b}','approve')">Approve merge</button>
            <button class="btn-reject" onclick="decideReview('${l.person_id_a}','${l.person_id_b}','reject')">Reject (keep separate)</button>
          </span>
        </div>`).join('') +
      reviewed.map(l => `
        <div class="review-row reviewed">
          <span>&#10003; Reviewed: confirmed as separate people (similarity score ${l.score}) &mdash; kept unmerged by human decision.</span>
        </div>`).join('');
  } else {
    reviewBanner.style.display = 'none';
  }

  beforePanel.innerHTML = data.records.map(rec => {
    const idFields = Object.entries(rec.identity).filter(([k]) => k !== 'name' && k !== 'full_name' && k !== 'dob' && k !== 'phone');
    const badges = idFields.map(([k, v]) => v ? `<span class="id-badge mismatch">${k}: ${v}</span>` : '').join('');
    const consentClass = rec.consent === 'permit' ? 'consent-permit' : 'consent-deny';
    const consentLabel = rec.consent === 'permit' ? 'Consent: share permitted' : 'Consent: sharing DENIED';
    const events = rec.events.map(e =>
      `<div class="event"><div class="date">${e.date}</div><div class="label">${e.label}</div><div class="detail">${e.detail}</div></div>`
    ).join('');
    return `<div class="card">
      <h3>${rec.source}</h3>
      <div><span class="id-badge ${consentClass}">${consentLabel}</span></div>
      <div>${badges}</div>
      <div class="field-row"><b>Name:</b> ${rec.identity.name || rec.identity.full_name}</div>
      <div class="field-row"><b>DOB:</b> ${rec.identity.dob} &nbsp; <b>Phone:</b> ${rec.identity.phone}</div>
      ${events}
    </div>`;
  }).join('') || '<div class="empty">No records</div>';
}

function renderAfter({ bundle, withheld }) {
  const resources = (bundle.entry || []).map(e => e.resource);
  const patient = resources.find(r => r.resourceType === 'Patient');
  if (!patient) { afterPanel.innerHTML = '<div class="empty">No unified record yet</div>'; return; }

  const idBadges = (patient.identifier || []).map(i =>
    `<span class="id-badge">${i.system.split('/').slice(-2).join('/')}: ${i.value}</span>`
  ).join('');

  const consents = resources.filter(r => r.resourceType === 'Consent');
  const consentBadges = consents.map(c => {
    const permitted = c.provision.type === 'permit';
    return `<span class="id-badge ${permitted ? 'consent-permit' : 'consent-deny'}">${c.organization[0].display}: ${permitted ? 'permitted' : 'DENIED'}</span>`;
  }).join('');

  const withheldHtml = (withheld || []).map(w =>
    `<div class="withheld-notice">&#128274; ${w.count} record${w.count > 1 ? 's' : ''} from ${w.organization} withheld &mdash; patient did not consent to sharing this source.</div>`
  ).join('');

  const timeline = resources
    // Encounter/Consent carry no info beyond what's already shown elsewhere
    // (Condition/Observation/Claim for the visit, the consent badges above).
    .filter(r => !['Patient', 'Encounter', 'Consent'].includes(r.resourceType))
    .map(r => {
      let date = (r.period && r.period.start) || r.created || r.recordedDate || r.effectiveDateTime || '';
      let label = (r.code && r.code.text) || r.resourceType;
      let detail = '';
      if (r.resourceType === 'Observation') detail = r.valueString || '';
      if (r.resourceType === 'Claim') detail = `KES ${r.total.value} claim`;
      return { date, label, detail, type: r.resourceType };
    })
    .filter(e => e.date)
    .sort((a, b) => a.date.localeCompare(b.date));

  const timelineHtml = timeline.map(e =>
    `<div class="event"><div class="date">${e.date} &middot; ${e.type}</div><div class="label">${e.label}</div><div class="detail">${e.detail}</div></div>`
  ).join('');

  afterPanel.innerHTML = `<div class="card unified-card">
    <h3>${patient.name[0].text} &mdash; one canonical record</h3>
    <div>${idBadges}</div>
    <div class="field-row"><b>DOB:</b> ${patient.birthDate || '-'}</div>
    <div class="field-row"><b>Consent per source:</b></div>
    <div>${consentBadges}</div>
    ${withheldHtml}
    ${timelineHtml || '<div class="empty">No linked clinical events</div>'}
  </div>`;
}

loadPatients();
</script>
</body>
</html>
