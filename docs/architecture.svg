<svg xmlns="http://www.w3.org/2000/svg" width="900" height="830" viewBox="0 0 900 830" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="830" fill="#ffffff"/>

  <!-- Legend -->
  <text x="700" y="35" font-size="13" font-weight="700" fill="#1c2530">Legend</text>
  <rect x="700" y="45" width="150" height="30" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="775" y="64" font-size="11" text-anchor="middle" fill="#1c2530">Local / floci</text>
  <rect x="700" y="85" width="150" height="30" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="775" y="104" font-size="11" text-anchor="middle" fill="#1c2530">Real AWS required</text>
  <rect x="700" y="125" width="150" height="30" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="775" y="144" font-size="11" text-anchor="middle" fill="#1c2530">Data source</text>

  <!-- Sources -->
  <rect x="20" y="40" width="180" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="110" y="65" font-size="12" text-anchor="middle" fill="#1c2530">NHIF Claims (CSV)</text>
  <text x="110" y="82" font-size="11" text-anchor="middle" fill="#44536b">keyed on nhif_member_no</text>

  <rect x="240" y="40" width="180" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="330" y="65" font-size="12" text-anchor="middle" fill="#1c2530">Facility B / AKUH (JSON)</text>
  <text x="330" y="82" font-size="11" text-anchor="middle" fill="#44536b">keyed on mrn</text>

  <rect x="460" y="40" width="200" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="560" y="65" font-size="12" text-anchor="middle" fill="#1c2530">Facility C Clinic (TXT)</text>
  <text x="560" y="82" font-size="11" text-anchor="middle" fill="#44536b">patient_code, no national ID</text>

  <!-- Matching -->
  <rect x="240" y="160" width="260" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="370" y="183" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2530">Identity Matching</text>
  <text x="370" y="200" font-size="11" text-anchor="middle" fill="#44536b">matching/match_patients.py</text>
  <text x="370" y="215" font-size="11" text-anchor="middle" fill="#44536b">deterministic national_id, else fuzzy</text>
  <text x="370" y="229" font-size="11" text-anchor="middle" fill="#44536b">phone + dob + name</text>

  <!-- Bundle builder -->
  <rect x="240" y="280" width="260" height="70" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="370" y="303" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2530">FHIR R4 Bundle Builder</text>
  <text x="370" y="320" font-size="11" text-anchor="middle" fill="#44536b">matching/build_fhir_bundles.py</text>
  <text x="370" y="335" font-size="11" text-anchor="middle" fill="#44536b">-&gt; Patient/Encounter/Condition/... NDJSON</text>

  <!-- S3 -->
  <rect x="240" y="390" width="260" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="370" y="413" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2530">S3 Bucket</text>
  <text x="370" y="430" font-size="11" text-anchor="middle" fill="#44536b">raw/ + fhir-ready/</text>
  <text x="370" y="445" font-size="11" text-anchor="middle" fill="#44536b">floci for dev iteration -&gt; real bucket for import</text>

  <!-- HealthLake -->
  <rect x="240" y="500" width="260" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="370" y="523" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2530">AWS HealthLake</text>
  <text x="370" y="540" font-size="11" text-anchor="middle" fill="#44536b">FHIR R4 Data Store</text>
  <text x="370" y="555" font-size="11" text-anchor="middle" fill="#44536b">StartFHIRImportJob</text>
  <text x="370" y="570" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">NOT emulated by floci</text>

  <!-- Query layer -->
  <rect x="240" y="620" width="260" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="370" y="643" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2530">Query Layer</text>
  <text x="370" y="660" font-size="11" text-anchor="middle" fill="#44536b">query_api/healthlake_query.py</text>
  <text x="370" y="675" font-size="11" text-anchor="middle" fill="#44536b">GET /Patient/{id}/$everything (SigV4)</text>

  <!-- Demo UI -->
  <rect x="240" y="730" width="260" height="70" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="370" y="753" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2530">Demo UI</text>
  <text x="370" y="770" font-size="11" text-anchor="middle" fill="#44536b">demo_ui/server.py (Flask)</text>
  <text x="370" y="785" font-size="11" text-anchor="middle" fill="#44536b">Before (siloed) vs After (unified)</text>

  <!-- Edges -->
  <path d="M110,100 L110,140 L360,140 L360,160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M330,100 L330,160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,100 L560,140 L380,140 L380,160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370,240 L370,280" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370,350 L370,390" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370,460 L370,500" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="483" font-size="10.5" text-anchor="middle" fill="#44536b">StartFHIRImportJob</text>
  <path d="M370,580 L370,620" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370,690 L370,730" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
